[package]
name = "web_splats"
version = "0.1.0"
edition = "2021"
authors = ["Simon Niedermayr", "Josef Stumpfegger"]
description = "3D Gaussian Splatting Viewer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wgpu = { version = "~24" }
winit = "0.30.9"
cgmath = { version = "0.18.0", features = [
    "bytemuck",
], git = 'https://github.com/rustgd/cgmath' }
env_logger = "0.11"
clap = { version = "4.5.35", features = ["derive", "env"] }
bytemuck = { version = "1.14.3", features = ["derive"] }
anyhow = "1.0.97"
ply-rs = "0.1.3"
byteorder = "1.5.0"
serde_json = "1.0.140"
serde = { version = "1.0.188", features = ["derive"] }
num-traits = "0.2.19"
half = { version = "2.6.0", features = ["bytemuck", "num-traits"] }
log = "0.4.27"
rayon = "1.9.0"
image = "0.25.6"
indicatif = "~0.18"

egui = "0.31.1"
egui-wgpu = "0.31.1"
egui-winit = { version = "0.31.1", features = [], default-features = false }
egui_plot = "0.32.1"
egui_dnd = "0.12.0"

npyz = { version = "0.8.3", features = ["npz", "half"], optional = true }
futures-intrusive = "0.5.0"
splines = { features = [
    "cgmath",
], git = "https://github.com/KeKsBoTer/splines" }
reqwest = "0.12.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "0.4.0", features = ["macro"] }
rand = "0.9"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
rmcp = { version = "0.3.0", features = [
    "client",
    "transport-sse-client",
    "reqwest",
    "transport-streamable-http-client",
    "transport-child-process",
    "tower",
    "auth"
] }
futures-util = "0.3"


[dev-dependencies]
wasm-bindgen-cli = "0.2.92"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "viewer"

[[bin]]
name = "video"
required-features = ["video"]

[[example]]
name = "test_mcp_client"

[[example]]
name = "test_enhanced_chat"

[[example]]
name = "demo_request_format"

[features]
npz = ["dep:npyz"]
video = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.2", features = ["wasm_js"] }
wasm-bindgen = "0.2.100"
console_error_panic_hook = "0.1.7"
wasm-bindgen-futures = "0.4.42"
console_log = "1"
log = "0.4"
web-time = "1.1.0"
lazy_static = "1.4.0"
chrono = { version = "0.4", features = ["wasm-bindgen"] }
web-sys = { version = "0.3.69", features = [
    "console",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
    "Storage",
    "Location",
    "Url",
    "UrlSearchParams",
] }

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
